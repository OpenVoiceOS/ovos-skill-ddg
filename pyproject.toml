[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-skill-ddg"
dynamic = ["version"]
description = "OVOS DuckDuckGo skill — factual Q&A via DDG Instant Answers"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
    "ovos-utils>=0.7.0,<1.0.0",
    "ovos-workshop>=8.0.0,<10.0.0",
    "ovos-plugin-manager>=2.1.0,<3.0.0",
    "ovos-ddg-plugin>=0.1.0a1,<2.0.0",
]

[project.entry-points."opm.skill"]
"ovos-skill-ddg.openvoiceos" = "ovos_skill_ddg:DuckDuckGoSkill"

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_skill_ddg*"]

[tool.setuptools.package-data]
"ovos_skill_ddg" = ["locale/**/*", "*.json"]

[tool.setuptools.dynamic]
version = {attr = "ovos_skill_ddg.version.__version__"}

[project.optional-dependencies]
test = [
    "ovoscope<1.0.0",
    "ovos-ddg-plugin>=0.1.0a1,<2.0.0",
]

[tool.pytest.ini_options]
testpaths = ["test/unittests"]
